<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy New Year 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Roboto&display=swap" rel="stylesheet">
<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background-image: url('https://www.citypng.com/public/uploads/preview/2026-happy-new-year-hd-transparent-background-704081695041287s1uo7vuyfl.png');
    background-size: cover;
    background-position: center;
}
canvas {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 0;
    pointer-events: none;
}

/* Messages */
.message {
    position: absolute;
    width: 100%;
    text-align: center;
    font-family: 'Pacifico', cursive;
    text-shadow: 2px 2px 15px rgba(0,0,0,0.7);
    opacity: 0;
    transform: scale(0.5);
    animation-fill-mode: forwards;
    z-index: 2;
}
.top-message { top: 8%; font-size: 50px; color: #FFD700; }
.middle-message { top: 45%; transform: translateY(-50%) scale(0.5); font-size: 40px; color: #FF7A5A; }
.bottom-message { bottom: 12%; font-size: 38px; color: #32CD32; }

/* Fade + scale animation for messages */
@keyframes fadeScale {
    0% { opacity: 0; transform: scale(0.5);}
    50% { opacity: 1; transform: scale(1.2);}
    100% { opacity: 1; transform: scale(1);}
}

/* Marquee */
.marquee-container { position: fixed; bottom: 0; width: 100%; height: 60px; overflow: hidden; background: linear-gradient(90deg, #0f2027, #203a43, #2c5364); z-index: 3; }
.snake-text {
    position: absolute;
    white-space: nowrap;
    font-size: 16px;
    font-weight: bold;
    left: -100%;
    top: 50%;
    transform: translateY(-50%);
    animation: zigzagMarquee 25s linear infinite;
    background: linear-gradient(90deg, #ffdd00, #ff6ec7, #00f2ff, #7CFF00);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

@keyframes zigzagMarquee {
    0% { left: -100%; top: 40%; }
    25% { top: 60%; }
    50% { left: 50%; top: 50%; }
    75% { top: 40%; }
    100% { left: 100%; top: 50%; }
}

/* Responsive */
@media (max-width: 768px) { .top-message { font-size: 38px;} .middle-message { font-size: 30px;} .bottom-message { font-size: 28px;} }
@media (max-width: 480px) { .top-message { font-size: 30px;} .middle-message { font-size: 24px;} .bottom-message { font-size: 22px;} .snake-text { font-size: 14px;}}
</style>
</head>
<body>

<canvas id="fireworks"></canvas>
<canvas id="sparkles"></canvas>

<div class="message top-message">Happy New Year 2026!</div>
<div class="message middle-message">Thank you for your amazing work in 2025!</div>
<div class="message bottom-message">Let's achieve even more together in 2026!</div>

<div class="marquee-container">
    <div class="snake-text">From transport team ✨ [ Sameer | Ram | Rick ]</div>
</div>

<script>
/* 🎆 FIREWORKS */
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");
let cw = canvas.width = window.innerWidth;
let ch = canvas.height = window.innerHeight;

window.addEventListener('resize', () => {
    cw = canvas.width = window.innerWidth;
    ch = canvas.height = window.innerHeight;
});

class Particle {
    constructor(x, y, color, speed, angle, gravity) {
        this.x = x; this.y = y; this.color = color;
        this.speed = speed; this.angle = angle;
        this.gravity = gravity; this.alpha = 1; this.friction = 0.98;
    }
    update() {
        this.speed *= this.friction;
        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed + this.gravity;
        this.alpha -= 0.01;
    }
    draw() {
        ctx.globalAlpha = this.alpha;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 2, 0, Math.PI*2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.globalAlpha = 1;
    }
}

let particles = [];
const colors = ["#ff0043","#ffd700","#00ffff","#7CFF00","#ff6ec7","#ffffff"];

function launchFirework() {
    const edge = Math.floor(Math.random()*4);
    let x, y;
    switch(edge){
        case 0: x = Math.random()*cw; y = 0; break;
        case 1: x = Math.random()*cw; y = ch; break;
        case 2: x = 0; y = Math.random()*ch; break;
        case 3: x = cw; y = Math.random()*ch; break;
    }
    for(let i=0;i<80;i++){
        const angle = Math.random()*Math.PI*2;
        const speed = Math.random()*5+2;
        const color = colors[Math.floor(Math.random()*colors.length)];
        const gravity = (edge===0?1:edge===1?-1:0) + (edge===2||edge===3?0:0.05);
        particles.push(new Particle(x,y,color,speed,angle,gravity));
    }

    // Firework sound
    if(Math.random() < 0.6){
        const sound = new Audio('firework.mp3'); 
        sound.volume = 0.5;
        sound.play();
    }
}

function animateFireworks() {
    ctx.fillStyle = "rgba(0,0,0,0.2)";
    ctx.fillRect(0,0,cw,ch);
    for(let i=particles.length-1;i>=0;i--){
        let p = particles[i];
        p.update();
        p.draw();
        if(p.alpha<=0) particles.splice(i,1);
    }
    requestAnimationFrame(animateFireworks);
}
setInterval(launchFirework, 500);
animateFireworks();

/* 🌟 Messages appear one by one */
const messages = document.querySelectorAll(".message");
messages.forEach((msg, index)=>{
    setTimeout(()=>{
        msg.style.animation = "fadeScale 1s forwards";
    }, index*2500);
});

/* ✨ SPARKLES CONFETTI */
const sparklesCanvas = document.getElementById("sparkles");
const sctx = sparklesCanvas.getContext("2d");
sparklesCanvas.width = cw;
sparklesCanvas.height = ch;

class Sparkle {
    constructor(x, y, color, size, speedY) {
        this.x = x; this.y = y;
        this.color = color;
        this.size = size;
        this.speedY = speedY;
        this.alpha = 1;
    }
    update() {
        this.y -= this.speedY;
        this.alpha -= 0.02;
    }
    draw() {
        sctx.globalAlpha = this.alpha;
        sctx.fillStyle = this.color;
        sctx.beginPath();
        sctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
        sctx.fill();
        sctx.globalAlpha = 1;
    }
}

let sparkles = [];
function createSparkles() {
    messages.forEach(msg => {
        const rect = msg.getBoundingClientRect();
        for(let i=0;i<2;i++){ // few sparkles per frame per message
            sparkles.push(new Sparkle(
                rect.left + Math.random()*rect.width,
                rect.top + Math.random()*rect.height,
                colors[Math.floor(Math.random()*colors.length)],
                Math.random()*3+1,
                Math.random()*1.5+0.5
            ));
        }
    });
}

function animateSparkles() {
    sctx.clearRect(0,0,cw,ch);
    createSparkles();
    for(let i=sparkles.length-1;i>=0;i--){
        let sp = sparkles[i];
        sp.update();
        sp.draw();
        if(sp.alpha<=0) sparkles.splice(i,1);
    }
    requestAnimationFrame(animateSparkles);
}
animateSparkles();
</script>
</body>
</html>
